<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<div class="wrap auth"><form class="card" id="reset-form" novalidate>
  <h1 style="font-size:2rem">Choose a new password</h1>
  <div id="form-alert"></div>
  <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="err"></div></div>
  <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><div class="err"></div></div>
  <button class="btn block" type="submit">Update password</button>
</form></div>
</main>
<footer id="site-footer"></footer>
<script src="/socket.io/socket.io.js"></script>
