<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · Grove Store</title>
<meta name="description" content="Grove Store: everyday things, well made. Live order tracking and easy cancellation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2317402f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2b138'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<div class="wrap" style="max-width:760px"><h1 style="font-size:2.2rem;margin-top:1.5rem">Your profile</h1>
  <form class="card stack" id="profile-form" novalidate>
    <div id="form-alert"></div>
    <div class="grid2"><div class="field"><label for="name">Full name</label><input id="name" name="name" required><div class="err"></div></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required><div class="err"></div></div></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" disabled></div>
    <div class="field"><label for="address">Default address</label><textarea id="address" name="address" rows="2"></textarea></div>
    <div class="grid2"><div class="field"><label for="city">City</label><input id="city" name="city"></div><div class="field"><label for="state">State</label><input id="state" name="state"></div></div>
    <div class="field" style="max-width:240px"><label for="pincode">Pincode</label><input id="pincode" name="pincode" maxlength="6" inputmode="numeric"><div class="err"></div></div>
    <button class="btn" type="submit">Save changes</button>
  </form>
  <form class="card stack" id="password-form" style="margin-top:1.5rem" novalidate>
    <h2 style="font-size:1.3rem">Change password</h2><div id="pw-alert"></div>
    <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required><div class="err"></div></div>
    <div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required><div class="err"></div></div>
    <button class="btn" type="submit">Update password</button>
  </form>
  <div class="row" style="margin:1.5rem 0"><a class="btn ghost" href="/orders.html">View my orders</a><button class="btn ghost" id="logout-all">Log out everywhere</button></div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
