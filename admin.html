<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Grove Store</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="admin-shell">
    <nav class="admin-nav" aria-label="Admin sections">
      <button data-tab="dashboard" class="on">Dashboard</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="products">Products</button>
      <button data-tab="users">Users</button>
    </nav>
    <section>
      <div id="tab-dashboard"></div>
      <div id="tab-orders" hidden>
        <div class="section-head"><h2 style="margin:0">Orders</h2><span class="muted small" id="orders-count"></span></div>
        <div class="filters-bar">
          <input type="search" id="o-q" placeholder="Search order ID, name, email, phone" aria-label="Search orders">
          <select id="o-status" aria-label="Filter by status"><option value="">All statuses</option><option value="PENDING">Pending (placed / confirmed / packed)</option><option>PLACED</option><option>CONFIRMED</option><option>PACKED</option><option>SHIPPED</option><option>OUT_FOR_DELIVERY</option><option>DELIVERED</option><option>CANCELLED</option></select>
          <select id="o-pay" aria-label="Filter by payment"><option value="">All payments</option><option>PENDING</option><option>PAID</option><option>FAILED</option><option>REFUND_PENDING</option><option>REFUNDED</option><option>CANCELLED</option></select>
        </div>
        <div id="o-user" class="small" hidden></div>
        <div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody id="o-body"></tbody></table></div>
        <div class="pager" id="o-pager"></div>
      </div>
      <div id="tab-products" hidden>
        <div class="section-head"><h2 style="margin:0">Products</h2><button class="btn" id="p-add">Add product</button></div>
        <div class="filters-bar"><input type="search" id="p-q" placeholder="Search products" aria-label="Search products"><select id="p-status" aria-label="Filter by status"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
        <div class="table-wrap"><table><thead><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="p-body"></tbody></table></div>
        <div class="pager" id="p-pager"></div>
      </div>
      <div id="tab-users" hidden>
        <div class="section-head"><h2 style="margin:0">Users</h2></div>
        <div class="filters-bar"><input type="search" id="u-q" placeholder="Search name, email, phone" aria-label="Search users"></div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Joined</th><th>Orders</th><th>Spent</th><th>Account</th><th></th></tr></thead><tbody id="u-body"></tbody></table></div>
        <div class="pager" id="u-pager"></div>
      </div>
    </section>
  </div>
</main>

<dialog id="order-dlg"><div class="dlg" id="order-dlg-body"></div></dialog>

<dialog id="product-dlg"><form class="dlg" id="product-form" novalidate>
  <h2 id="product-title" style="font-size:1.4rem">Add product</h2>
  <div id="product-alert"></div>
  <input type="hidden" name="_id">
  <div class="field"><label for="pf-name">Name</label><input id="pf-name" name="name" required><div class="err"></div></div>
  <div class="field"><label for="pf-desc">Description</label><textarea id="pf-desc" name="description" rows="3" required></textarea><div class="err"></div></div>
  <div class="grid2">
    <div class="field"><label for="pf-cat">Category</label><input id="pf-cat" name="category" list="cat-options" required><datalist id="cat-options"></datalist><div class="err"></div></div>
    <div class="field"><label for="pf-brand">Brand</label><input id="pf-brand" name="brand"></div>
    <div class="field"><label for="pf-price">Price (₹)</label><input id="pf-price" name="price" type="number" min="0" step="0.01" required><div class="err"></div></div>
    <div class="field"><label for="pf-disc">Discount price (₹, optional)</label><input id="pf-disc" name="discountPrice" type="number" min="0" step="0.01"><div class="err"></div></div>
    <div class="field"><label for="pf-stock">Stock quantity</label><input id="pf-stock" name="stock" type="number" min="0" step="1" required><div class="err"></div></div>
    <div class="field"><label for="pf-active">Status</label><select id="pf-active" name="isActive"><option value="true">Active (visible in shop)</option><option value="false">Inactive (hidden)</option></select></div>
  </div>
  <div class="field"><label for="pf-files">Upload images (JPG, PNG, WEBP, up to 3 MB each)</label><input id="pf-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></div>
  <div class="field"><label for="pf-images">Image URLs (one per line; first is the main image)</label><textarea id="pf-images" name="images" rows="3" placeholder="/uploads/… or https://…"></textarea><div class="err"></div></div>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="product-cancel">Close</button><button type="submit" class="btn">Save product</button></div>
</form></dialog>

<footer id="site-footer"></footer>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
