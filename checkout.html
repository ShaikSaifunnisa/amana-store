<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Grove Store</title>
<meta name="description" content="Grove Store: everyday things, well made. Live order tracking and easy cancellation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2317402f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2b138'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<div class="wrap"><h1 style="font-size:2.2rem;margin-top:1.5rem">Checkout</h1>
<div class="two-col">
  <form id="checkout-form" class="card" novalidate>
    <div id="form-alert"></div>
    <h2 style="font-size:1.3rem">Delivery details</h2>
    <div class="grid2">
      <div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required><div class="err"></div></div>
      <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><div class="err"></div></div>
    </div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
    <div class="field"><label for="address">Address</label><textarea id="address" name="address" rows="2" autocomplete="street-address" required></textarea><div class="err"></div></div>
    <div class="grid2">
      <div class="field"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required><div class="err"></div></div>
      <div class="field"><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" required><div class="err"></div></div>
    </div>
    <div class="field" style="max-width:240px"><label for="pincode">Pincode</label><input id="pincode" name="pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" required><div class="err"></div></div>
    <h2 style="font-size:1.3rem;margin-top:1.5rem">Payment</h2>
    <label class="pay-opt"><input type="radio" name="paymentMethod" value="COD" checked><span><b>Cash on Delivery</b><br><span class="muted small">Pay in cash when your order arrives.</span></span></label>
    <label class="pay-opt" id="online-opt"><input type="radio" name="paymentMethod" value="ONLINE"><span><b>Pay online</b><br><span class="muted small" id="online-note">Cards, UPI and netbanking via Razorpay.</span></span></label>
  </form>
  <aside class="card" id="summary" style="position:sticky;top:5.5rem"></aside>
</div></div>
</main>
<footer id="site-footer"></footer>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
